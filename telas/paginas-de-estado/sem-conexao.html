<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Sem conexão com a internet</title>
<link rel="stylesheet" href="../../design-system/tokens/tokens.css">
<link rel="stylesheet" href="../../design-system/componentes/bundle.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</head>
<body>

<div style="min-height: 720px; display: flex; flex-direction: column; background: var(--surface); font-family: var(--font-sans); color: var(--ink)">
<header style="display: flex; align-items: center; height: var(--header-height); padding: 0 var(--space-6); background: var(--surface-raised); border-bottom: 1px solid var(--border)">
<div style="display: flex; align-items: center; gap: var(--space-4)"><span role="img" aria-label="Instituto Kernel" style="font-size: 30px; line-height: 1; font-weight: 800; letter-spacing: -0.03em; color: var(--primary)">kernel<span style="color: var(--alert)">_</span></span><span aria-hidden="true" style="width: 1px; height: 24px; background: var(--border-strong)"></span><span style="font-weight: 600; font-size: 15px; line-height: 20px; color: var(--ink-muted)">AVA · Portal do Aluno</span></div>
</header>
<main style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px; padding: 48px 32px; text-align: center">
<span style="display: flex; align-items: center; justify-content: center; width: 96px; height: 96px; border-radius: 50%; background: var(--tint-100); color: var(--primary)"><svg class="ava-ico" viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h.01"></path><path d="M8.5 16.429a5 5 0 0 1 7 0"></path><path d="M5 12.859a10 10 0 0 1 5.17-2.69"></path><path d="M19 12.859a10 10 0 0 0-2.007-1.523"></path><path d="M2 8.82a15 15 0 0 1 4.177-2.643"></path><path d="M22 8.82a15 15 0 0 0-11.288-3.764"></path><path d="m2 2 20 20"></path></svg></span>
<div style="display: flex; flex-direction: column; gap: 12px; max-width: 560px">
<h1 style="margin: 0; font-size: 36px; line-height: 44px; font-weight: 800; letter-spacing: -0.02em">Sem conexão com a internet</h1>
<p style="margin: 0; font-size: 17px; line-height: 26px; color: var(--ink-muted)">Verifique o Wi-Fi ou o cabo de rede e tente de novo. Quando a conexão voltar, você pode continuar de onde parou.</p>
</div>
<button class="ava-btn ava-btn--primary ava-btn--lg" type="button"><svg class="ava-ico" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"></path><path d="M21 3v5h-5"></path><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"></path><path d="M3 21v-5h5"></path></svg>Tentar de novo</button>
</main>
</div>

</body>
</html>
