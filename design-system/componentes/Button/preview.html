<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Button · Design system AVA</title>
<link rel="stylesheet" href="../../tokens/tokens.css">
<link rel="stylesheet" href="../bundle.css">
<style>body{margin:0;background:var(--surface);color:var(--ink);font-family:var(--font-sans)}</style>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
.pv{padding:24px}
.pv-row{display:flex;flex-wrap:wrap;gap:16px;align-items:center}
.pv-col{display:flex;flex-direction:column;gap:16px}
.pv-cap{font-size:12px;line-height:16px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-muted);margin-bottom:8px}
.pv-grid2{display:grid;grid-template-columns:1fr 1fr;gap:24px}
</style>
</head>
<body>
<div class="pv pv-col">
<div><div class="pv-cap">Variantes</div><div class="pv-row">
<button class="ava-btn ava-btn--primary">Entregar atividade</button>
<button class="ava-btn ava-btn--secondary">Salvar rascunho</button>
<button class="ava-btn ava-btn--ghost">Cancelar</button>
<button class="ava-btn ava-btn--danger"><svg class="ava-ico" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>Excluir conteúdo</button>
<button class="ava-btn ava-btn--accent">Ver alteração</button></div></div>
<div><div class="pv-cap">Tamanhos e ícone</div><div class="pv-row">
<button class="ava-btn ava-btn--primary ava-btn--sm">Pequeno</button>
<button class="ava-btn ava-btn--primary"><svg class="ava-ico" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V4M7 9l5-5 5 5"/><path d="M4 20h16"/></svg>Padrão</button>
<button class="ava-btn ava-btn--primary ava-btn--lg">Grande<svg class="ava-ico" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button></div></div>
<div><div class="pv-cap">Estados</div><div class="pv-row">
<button class="ava-btn ava-btn--primary" disabled>Desabilitado</button>
<button class="ava-btn ava-btn--secondary" disabled>Desabilitado</button>
<button class="ava-btn ava-btn--primary" aria-busy="true"><span class="ava-spinner"></span>Enviando</button></div></div>
</div>
</body>
</html>
