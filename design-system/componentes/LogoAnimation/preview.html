<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LogoAnimation · Design system AVA</title>
<link rel="stylesheet" href="../../tokens/tokens.css">
<link rel="stylesheet" href="../bundle.css">
<style>body{margin:0;background:var(--surface);color:var(--ink);font-family:var(--font-sans)}</style>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=Plus+Jakarta+Sans:wght@500;800&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%}
.stage{position:relative;box-sizing:border-box;height:400px;padding:24px 16px 72px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;background:var(--primary);color:var(--on-primary);font-family:var(--font-sans);overflow:hidden}
.boot{font-family:var(--font-mono);font-weight:500;font-size:16px;line-height:24px;height:24px;color:var(--tint-100);letter-spacing:.02em;white-space:pre;transition:opacity .35s ease}
.boot.off{opacity:0}
.mark{margin:0;position:relative;font-weight:800;font-size:112px;line-height:1;letter-spacing:-.025em}
.ghost{visibility:hidden;white-space:pre}
.typed-layer{position:absolute;left:0;top:0;white-space:pre}
.cur{color:var(--alert)}
.cur.blink{animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.inst{font-weight:500;font-size:15px;line-height:20px;letter-spacing:.38em;margin-right:-.38em;color:var(--tint-100);opacity:0;transform:translateY(6px);transition:opacity .9s ease,transform .9s ease,letter-spacing 1.1s cubic-bezier(.2,.7,.2,1)}
.inst.on{opacity:1;transform:none;letter-spacing:.5em;margin-right:-.5em}
.inst.pre{letter-spacing:.9em;margin-right:-.9em}
.controls{position:absolute;bottom:24px;left:0;right:0;display:flex;justify-content:center}
@media (prefers-reduced-motion:reduce){.cur.blink{animation:none}.inst{transition:none}}
</style>
</head>
<body>
<div class="stage">
  <div class="boot off" id="boot" aria-hidden="true"></div>
  <h1 class="mark" aria-label="Instituto Kernel">
    <span class="ghost" aria-hidden="true">kernel_</span>
    <span class="typed-layer" aria-hidden="true"><span id="typed">kernel</span><span class="cur blink" id="cur">_</span></span>
  </h1>
  <div class="inst on" id="inst">INSTITUTO</div>
  <div class="controls"><button class="ava-btn ava-btn--secondary" id="replay" type="button">Reproduzir de novo</button></div>
</div>
<script>
(function(){
  var boot=document.getElementById('boot'),typed=document.getElementById('typed'),cur=document.getElementById('cur'),inst=document.getElementById('inst'),btn=document.getElementById('replay');
  var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  var run=0,WORD='kernel',BOOT='> init instituto/kernel';
  function sleep(ms){return new Promise(function(r){setTimeout(r,ms)})}
  async function play(){
    var id=++run;
    function alive(){return id===run}
    boot.classList.add('off');boot.textContent='';
    typed.textContent='';cur.className='cur blink';
    inst.className='inst pre';
    if(reduce){typed.textContent=WORD;inst.className='inst on';return}
    await sleep(500);if(!alive())return;
    boot.classList.remove('off');
    for(var i=1;i<=BOOT.length;i++){boot.textContent=BOOT.slice(0,i);await sleep(42);if(!alive())return}
    await sleep(450);if(!alive())return;
    boot.classList.add('off');
    await sleep(500);if(!alive())return;
    cur.className='cur blink';await sleep(900);if(!alive())return;
    cur.className='cur';
    for(var j=1;j<=WORD.length;j++){typed.textContent=WORD.slice(0,j);await sleep(120+(j%2)*40);if(!alive())return}
    await sleep(200);if(!alive())return;
    cur.className='cur blink';
    await sleep(700);if(!alive())return;
    inst.className='inst on';
    await sleep(4200);if(!alive())return;
    play();
  }
  btn.addEventListener('click',play);
  if(document.fonts&&document.fonts.ready){document.fonts.ready.then(play)}else{play()}
})();
</script>
</body>
</html>
