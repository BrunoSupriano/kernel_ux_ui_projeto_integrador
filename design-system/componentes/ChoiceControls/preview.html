<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ChoiceControls · Design system AVA</title>
<link rel="stylesheet" href="../../tokens/tokens.css">
<link rel="stylesheet" href="../bundle.css">
<style>body{margin:0;background:var(--surface);color:var(--ink);font-family:var(--font-sans)}</style>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
.pv{padding:24px}
.pv-row{display:flex;flex-wrap:wrap;gap:16px;align-items:center}
.pv-col{display:flex;flex-direction:column;gap:16px}
.pv-cap{font-size:12px;line-height:16px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-muted);margin-bottom:8px}
.pv-grid2{display:grid;grid-template-columns:1fr 1fr;gap:24px}
</style>
</head>
<body>
<div class="pv"><div class="pv-grid2">
<fieldset style="border:0;padding:0;margin:0"><legend class="ava-label">Receber avisos por</legend>
<label class="ava-choice"><input type="checkbox" checked><span class="ava-choice__text"><span class="ava-choice__label">Notificação no AVA</span><span class="ava-hint">Sempre ligada para mudança de sala.</span></span></label>
<label class="ava-choice"><input type="checkbox" checked><span class="ava-choice__text"><span class="ava-choice__label">E-mail institucional</span></span></label>
<label class="ava-choice"><input type="checkbox"><span class="ava-choice__text"><span class="ava-choice__label">Notificação no celular</span><span class="ava-hint">Disponível quando o aplicativo estiver ativo.</span></span></label>
</fieldset>
<fieldset style="border:0;padding:0;margin:0"><legend class="ava-label">Entrega fora do prazo</legend>
<label class="ava-choice"><input type="radio" name="r" checked><span class="ava-choice__text"><span class="ava-choice__label">Bloquear entrega</span></span></label>
<label class="ava-choice"><input type="radio" name="r"><span class="ava-choice__text"><span class="ava-choice__label">Permitir e marcar como atrasada</span></span></label>
<label class="ava-choice"><input type="radio" name="r" disabled><span class="ava-choice__text"><span class="ava-choice__label">Permitir com penalidade</span><span class="ava-hint">Indisponível nesta versão.</span></span></label>
</fieldset></div></div>
</body>
</html>
