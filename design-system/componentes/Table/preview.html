<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Table · Design system AVA</title>
<link rel="stylesheet" href="../../tokens/tokens.css">
<link rel="stylesheet" href="../bundle.css">
<style>body{margin:0;background:var(--surface);color:var(--ink);font-family:var(--font-sans)}</style>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
.pv{padding:24px}
.pv-row{display:flex;flex-wrap:wrap;gap:16px;align-items:center}
.pv-col{display:flex;flex-direction:column;gap:16px}
.pv-cap{font-size:12px;line-height:16px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-muted);margin-bottom:8px}
.pv-grid2{display:grid;grid-template-columns:1fr 1fr;gap:24px}
</style>
</head>
<body>
<div class="pv"><table class="ava-table"><caption>Entregas · Relatório de usabilidade</caption>
<thead><tr><th scope="col">Aluno</th><th scope="col">Entregue em</th><th scope="col">Status</th><th scope="col" class="num">Nota</th><th scope="col"><span class="ava-sr">Ação</span></th></tr></thead>
<tbody>
<tr><td>Ana Beatriz Souza</td><td>07/10, 21:14</td><td><span class="ava-badge ava-badge--graded"><svg class="ava-ico" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>Corrigida</span></td><td class="num">9,0</td><td><button class="ava-btn ava-btn--secondary ava-btn--sm">Ver correção</button></td></tr>
<tr aria-selected="true"><td>Bruno Supriano</td><td>07/10, 22:40</td><td><span class="ava-badge ava-badge--pending"><svg class="ava-ico" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Pendente</span></td><td class="num">—</td><td><button class="ava-btn ava-btn--secondary ava-btn--sm">Corrigir</button></td></tr>
<tr><td>Camila Reis</td><td>08/10, 00:12</td><td><span class="ava-badge ava-badge--late"><svg class="ava-ico" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7.5v5M12 16v.01"/></svg>Atrasada</span></td><td class="num">—</td><td><button class="ava-btn ava-btn--secondary ava-btn--sm">Corrigir</button></td></tr>
<tr><td>Diego Martins</td><td>—</td><td><span class="ava-badge ava-badge--pending"><svg class="ava-ico" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Sem entrega</span></td><td class="num">—</td><td><button class="ava-btn ava-btn--secondary ava-btn--sm">Ver correção</button></td></tr>
</tbody></table></div>
</body>
</html>
