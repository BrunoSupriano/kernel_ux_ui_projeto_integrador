<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Card · Design system AVA</title>
<link rel="stylesheet" href="../../tokens/tokens.css">
<link rel="stylesheet" href="../bundle.css">
<style>body{margin:0;background:var(--surface);color:var(--ink);font-family:var(--font-sans)}</style>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
.pv{padding:24px}
.pv-row{display:flex;flex-wrap:wrap;gap:16px;align-items:center}
.pv-col{display:flex;flex-direction:column;gap:16px}
.pv-cap{font-size:12px;line-height:16px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-muted);margin-bottom:8px}
.pv-grid2{display:grid;grid-template-columns:1fr 1fr;gap:24px}
</style>
</head>
<body>
<div class="pv"><div class="pv-grid2">
<a class="ava-card ava-card--link" href="#"><div class="ava-card__head"><div><div class="ava-card__title">Engenharia de Software</div><div class="ava-card__meta">Prof. Marta Lima · Turma ES-2026/2</div></div><span class="ava-badge ava-badge--changed"><svg class="ava-ico" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18v.01"/></svg>Sala alterada</span></div>
<div class="ava-card__meta"><svg class="ava-ico" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s7-6.2 7-11a7 7 0 0 0-14 0c0 4.8 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>Sala 205, Bloco B · terça, 19:00</div>
<div class="ava-card__stats"><div class="ava-stat"><span class="ava-stat__n">2</span><span class="ava-stat__l">atividades pendentes</span></div><div class="ava-stat"><span class="ava-stat__n">1</span><span class="ava-stat__l">aviso não lido</span></div></div></a>
<a class="ava-card ava-card--link" href="#"><div class="ava-card__head"><div><div class="ava-card__title">Banco de Dados</div><div class="ava-card__meta">Prof. Jorge Alves · Turma ES-2026/2</div></div></div>
<div class="ava-card__meta"><svg class="ava-ico" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s7-6.2 7-11a7 7 0 0 0-14 0c0 4.8 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>Sala 108, Bloco A · segunda, 20:50</div>
<div class="ava-card__stats"><div class="ava-stat"><span class="ava-stat__n">1</span><span class="ava-stat__l">atividade pendente</span></div><div class="ava-stat"><span class="ava-stat__n">0</span><span class="ava-stat__l">avisos não lidos</span></div></div></a>
</div></div>
</body>
</html>
