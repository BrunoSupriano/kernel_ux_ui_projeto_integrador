<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tabs · Design system AVA</title>
<link rel="stylesheet" href="../../tokens/tokens.css">
<link rel="stylesheet" href="../bundle.css">
<style>body{margin:0;background:var(--surface);color:var(--ink);font-family:var(--font-sans)}</style>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
.pv{padding:24px}
.pv-row{display:flex;flex-wrap:wrap;gap:16px;align-items:center}
.pv-col{display:flex;flex-direction:column;gap:16px}
.pv-cap{font-size:12px;line-height:16px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-muted);margin-bottom:8px}
.pv-grid2{display:grid;grid-template-columns:1fr 1fr;gap:24px}
</style>
</head>
<body>
<div class="pv pv-col">
<div><div class="pv-cap">Aluno</div><div class="ava-tabs" role="tablist" aria-label="Seções da disciplina"><button class="ava-tab" role="tab" aria-selected="true">Visão geral</button><button class="ava-tab" role="tab" aria-selected="false">Plano</button><button class="ava-tab" role="tab" aria-selected="false">Conteúdos</button><button class="ava-tab" role="tab" aria-selected="false">Atividades<span class="ava-tab__count">2</span></button><button class="ava-tab" role="tab" aria-selected="false">Notas</button><button class="ava-tab" role="tab" aria-selected="false">Avisos<span class="ava-tab__count">1</span></button><button class="ava-tab" role="tab" aria-selected="false">Sala e Horário</button></div></div>
<div><div class="pv-cap">Professor (as mesmas abas + extras no fim)</div><div class="ava-tabs" role="tablist" aria-label="Seções da disciplina"><button class="ava-tab" role="tab" aria-selected="false">Visão geral</button><button class="ava-tab" role="tab" aria-selected="false">Plano</button><button class="ava-tab" role="tab" aria-selected="true">Conteúdos</button><button class="ava-tab" role="tab" aria-selected="false">Atividades</button><button class="ava-tab" role="tab" aria-selected="false">Entregas<span class="ava-tab__count">5</span></button><button class="ava-tab" role="tab" aria-selected="false">Diário de notas</button><button class="ava-tab" role="tab" aria-selected="false">Avisos</button><button class="ava-tab" role="tab" aria-selected="false">Sala e Horário</button><button class="ava-tab" role="tab" aria-selected="false">Alunos</button></div></div>
</div>
</body>
</html>
