<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Autosave · Design system AVA</title>
<link rel="stylesheet" href="../../tokens/tokens.css">
<link rel="stylesheet" href="../bundle.css">
<style>body{margin:0;background:var(--surface);color:var(--ink);font-family:var(--font-sans)}</style>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
.pv{padding:24px}
.pv-row{display:flex;flex-wrap:wrap;gap:16px;align-items:center}
.pv-col{display:flex;flex-direction:column;gap:16px}
.pv-cap{font-size:12px;line-height:16px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-muted);margin-bottom:8px}
.pv-grid2{display:grid;grid-template-columns:1fr 1fr;gap:24px}
</style>
</head>
<body>
<div class="pv pv-col"><span class="ava-save ava-save--ok" role="status"><svg class="ava-ico" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h11l3 3v13H5z"/><path d="M8 4v5h7V4M8 20v-6h8v6"/></svg>Salvo automaticamente às 14:02</span>
<span class="ava-save" role="status"><span class="ava-spinner"></span>Salvando…</span>
<span class="ava-save ava-save--err" role="status"><svg class="ava-ico" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7.5v5M12 16v.01"/></svg>Não foi possível salvar. Verifique sua conexão.</span></div>
</body>
</html>
