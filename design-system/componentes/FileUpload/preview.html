<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FileUpload · Design system AVA</title>
<link rel="stylesheet" href="../../tokens/tokens.css">
<link rel="stylesheet" href="../bundle.css">
<style>body{margin:0;background:var(--surface);color:var(--ink);font-family:var(--font-sans)}</style>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
.pv{padding:24px}
.pv-row{display:flex;flex-wrap:wrap;gap:16px;align-items:center}
.pv-col{display:flex;flex-direction:column;gap:16px}
.pv-cap{font-size:12px;line-height:16px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-muted);margin-bottom:8px}
.pv-grid2{display:grid;grid-template-columns:1fr 1fr;gap:24px}
</style>
</head>
<body>
<div class="pv pv-col" style="max-width:640px">
<div class="ava-drop"><span class="ava-drop__ico"><svg class="ava-ico" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V4M7 9l5-5 5 5"/><path d="M4 20h16"/></svg></span>
<div class="h4" style="font-weight:700">Arraste os arquivos para cá</div>
<div class="ava-hint">PDF, DOCX, imagem ou ZIP, até 20 MB por arquivo.</div>
<button class="ava-btn ava-btn--secondary ava-btn--sm" type="button">Escolher arquivos</button></div>
<div class="ava-file"><svg class="ava-ico" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></svg><div class="ava-file__main"><div class="ava-file__name">relatorio-usabilidade.pdf</div>
<div class="ava-progress" style="margin-top:6px"><div class="ava-progress__track"><div class="ava-progress__bar" style="width:64%"></div></div></div>
<div class="ava-file__meta">Enviando… 64% de 2,4 MB</div></div><button class="ava-iconbtn ava-iconbtn--plain" aria-label="Cancelar envio de relatorio-usabilidade.pdf"><svg class="ava-ico" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
<div class="ava-file"><svg class="ava-ico" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></svg><div class="ava-file__main"><div class="ava-file__name">anexo.zip</div>
<div class="ava-fielderr" style="margin-top:2px"><svg class="ava-ico" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7.5v5M12 16v.01"/></svg>Arquivo acima de 20 MB. Compacte ou envie por link.</div></div><button class="ava-iconbtn ava-iconbtn--plain" aria-label="Remover anexo.zip"><svg class="ava-ico" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg></button></div>
</div>
</body>
</html>
