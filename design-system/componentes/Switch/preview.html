<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Switch · Design system AVA</title>
<link rel="stylesheet" href="../../tokens/tokens.css">
<link rel="stylesheet" href="../bundle.css">
<style>body{margin:0;background:var(--surface);color:var(--ink);font-family:var(--font-sans)}</style>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
.pv{padding:24px}
.pv-row{display:flex;flex-wrap:wrap;gap:16px;align-items:center}
.pv-col{display:flex;flex-direction:column;gap:16px}
.pv-cap{font-size:12px;line-height:16px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-muted);margin-bottom:8px}
.pv-grid2{display:grid;grid-template-columns:1fr 1fr;gap:24px}
</style>
</head>
<body>
<div class="pv pv-col" style="max-width:520px">
<div class="pv-cap">Visibilidade de um item (P05)</div>
<button class="ava-switch" role="switch" aria-checked="true"><span class="ava-switch__track"></span>Visível para os alunos</button>
<button class="ava-switch" role="switch" aria-checked="false"><span class="ava-switch__track"></span>Oculto dos alunos</button>
<div class="pv-cap" style="margin-top:8px">Preferências de notificação (G03)</div>
<div class="ava-row" style="gap:24px"><button class="ava-switch" role="switch" aria-checked="true"><span class="ava-switch__track"></span>E-mail</button><button class="ava-switch" role="switch" aria-checked="true" disabled><span class="ava-switch__track"></span>No AVA</button></div>
<span class="ava-hint">Mudança de sala e horário é crítica: o canal no AVA e o e-mail não podem ser desligados.</span>
</div>
<script>
document.querySelectorAll('.ava-switch:not(:disabled)').forEach(function(b){b.addEventListener('click',function(){b.setAttribute('aria-checked',b.getAttribute('aria-checked')==='true'?'false':'true')})});
</script>
</body>
</html>
