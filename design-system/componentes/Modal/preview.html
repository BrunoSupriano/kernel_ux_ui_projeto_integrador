<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Modal · Design system AVA</title>
<link rel="stylesheet" href="../../tokens/tokens.css">
<link rel="stylesheet" href="../bundle.css">
<style>body{margin:0;background:var(--surface);color:var(--ink);font-family:var(--font-sans)}</style>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
.pv{padding:24px}
.pv-row{display:flex;flex-wrap:wrap;gap:16px;align-items:center}
.pv-col{display:flex;flex-direction:column;gap:16px}
.pv-cap{font-size:12px;line-height:16px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-muted);margin-bottom:8px}
.pv-grid2{display:grid;grid-template-columns:1fr 1fr;gap:24px}
</style>
</head>
<body>
<div class="ava-scrim" style="min-height:360px"><div class="ava-modal" role="dialog" aria-modal="true" aria-labelledby="mt">
<div class="ava-modal__head"><h2 class="ava-modal__title" id="mt">Excluir este conteúdo?</h2><button class="ava-iconbtn ava-iconbtn--plain" aria-label="Fechar"><svg class="ava-ico" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
<div class="ava-modal__body">“Slides da Semana 3” sai da sala dos alunos e não poderá ser recuperado. As 42 pessoas que já viram o material perdem o acesso.</div>
<div class="ava-modal__foot"><button class="ava-btn ava-btn--ghost">Cancelar</button><button class="ava-btn ava-btn--danger">Excluir conteúdo</button></div></div></div>
</body>
</html>
